<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LUMA · Table code</title>
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<style>
  :root{--ink:#0c0a08;--cream:#f4ecdf;--saf:#f2a33a;--lock:#8ff5cf;--serif:ui-serif,"New York","Iowan Old Style",Georgia,serif}
  *{box-sizing:border-box;margin:0}
  body{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:24px;
    background:#1b1713;font:15px/1.4 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--cream)}
  .card{width:min(380px,100%);border-radius:28px;overflow:hidden;background:var(--cream);color:var(--ink);box-shadow:0 30px 80px rgba(0,0,0,.5)}
  .head{padding:22px 24px 18px;background:var(--ink);color:var(--cream);text-align:center;
    background-image:radial-gradient(90% 120% at 50% 0%,rgba(242,163,58,.28),transparent 70%)}
  .brand{font:600 28px var(--serif);letter-spacing:.32em;margin-right:-.32em}
  .head p{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--saf);margin-top:4px}
  .body{padding:26px 24px 24px;text-align:center}
  .zone{position:relative;width:236px;height:236px;margin:0 auto}
  .zone i{position:absolute;width:30px;height:30px;border:3px solid var(--ink);border-radius:4px}
  .zone i:nth-child(1){left:0;top:0;border-right:0;border-bottom:0}
  .zone i:nth-child(2){right:0;top:0;border-left:0;border-bottom:0}
  .zone i:nth-child(3){right:0;bottom:0;border-left:0;border-top:0}
  .zone i:nth-child(4){left:0;bottom:0;border-right:0;border-top:0}
  .qr{position:absolute;inset:16px;background:#fff}
  .qr svg{width:100%;height:100%;display:block}
  h1{font:600 24px/1.15 var(--serif);margin-top:22px}
  .steps{display:flex;justify-content:center;gap:8px;margin-top:16px;padding:0;list-style:none;counter-reset:s}
  .steps li{flex:1;font-size:12px;line-height:1.3;color:rgba(12,10,8,.7);counter-increment:s}
  .steps li::before{content:counter(s);display:grid;place-items:center;width:24px;height:24px;margin:0 auto 6px;border-radius:50%;
    background:var(--ink);color:var(--cream);font-weight:700;font-size:12px}
  .foot{margin-top:18px;padding-top:14px;border-top:1px dashed rgba(12,10,8,.25);font:12px ui-monospace,Menlo,monospace;color:rgba(12,10,8,.55);word-break:break-all}
  .tools{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
  button{font:inherit;font-weight:650;padding:12px 18px;border-radius:14px;border:1px solid rgba(244,236,223,.2);background:rgba(244,236,223,.06);color:inherit;cursor:pointer}
  button.p{background:var(--saf);color:var(--ink);border:0}
  .tip{max-width:380px;text-align:center;font-size:12px;color:rgba(244,236,223,.5)}
  @media print{
    body{background:#fff;min-height:0;padding:0}
    .tools,.tip{display:none}
    .card{box-shadow:none;width:10cm;border:1px solid #ccc}
    .zone{width:8cm;height:8cm}
    .head{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  }
</style>
</head>
<body>
  <article class="card">
    <header class="head"><div class="brand">LUMA</div><p>Table menu</p></header>
    <div class="body">
      <div class="zone"><i></i><i></i><i></i><i></i><div class="qr" id="qr" role="img" aria-label="QR code that opens the AR menu"></div></div>
      <h1>Your menu lives on this code.</h1>
      <ol class="steps">
        <li>Scan with your phone camera</li>
        <li>Tap “Start camera”</li>
        <li>Point back at this code</li>
      </ol>
      <div class="foot" id="url"></div>
    </div>
  </article>
  <div class="tools">
    <button class="p" onclick="print()">Print table card</button>
    <button id="dl">Download QR (PNG)</button>
  </div>
  <p class="tip">Print the code at least 7 cm wide on matte paper and lay it flat — the dish appears on top of it. The QR always points to the site you opened this page from.</p>
<script src="/vendor/qrcode.min.js"></script>
<script>
  const target = new URLSearchParams(location.search).get('url') || location.origin + '/';
  const qr = qrcode(0, 'M'); qr.addData(target); qr.make();
  document.getElementById('qr').innerHTML = qr.createSvgTag({ cellSize: 8, margin: 2, scalable: true });
  document.getElementById('url').textContent = target.replace(/^https?:\/\//, '');
  document.getElementById('dl').onclick = () => {
    const n = qr.getModuleCount(), m = 4, s = 32, size = (n + m * 2) * s, c = document.createElement('canvas');
    c.width = c.height = size; const x = c.getContext('2d');
    x.fillStyle = '#fff'; x.fillRect(0, 0, size, size); x.fillStyle = '#0c0a08';
    for (let r = 0; r < n; r++) for (let k = 0; k < n; k++) if (qr.isDark(r, k)) x.fillRect((k + m) * s, (r + m) * s, s, s);
    const a = document.createElement('a'); a.download = 'luma-table-code.png'; a.href = c.toDataURL('image/png'); a.click();
  };
</script>
</body>
</html>
