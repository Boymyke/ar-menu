<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>LUMA · AR Menu</title>
<meta name="description" content="Point your phone at the code on your table and the menu appears on it.">
<meta name="theme-color" content="#0c0a08">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/app.css">
<script src="/app.js" defer></script>
</head>
<body>
  <video id="cam" playsinline muted autoplay aria-hidden="true"></video>
  <div class="backdrop" aria-hidden="true"></div>

  <!-- 3D stage: .anchor is glued to the QR code every frame -->
  <main class="stage" id="stage" aria-label="Dish on your table. Drag to turn it, tap to see its layers.">
    <div class="anchor" id="anchor">
      <div class="mat" aria-hidden="true"></div>
      <div class="shadow" aria-hidden="true"></div>
      <div class="lock" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
      <div class="ripple" aria-hidden="true"></div>
      <div class="turn" id="turn"><div class="dish" id="dish"></div></div>
    </div>
  </main>
  <div class="label" id="label" aria-hidden="true"><b id="lName"></b><span id="lPrice"></span></div>

  <!-- shown while the code isn't in view -->
  <div class="guide" id="guide" aria-live="polite">
    <div class="finder"><i></i><i></i><i></i><i></i><span class="scanline"></span></div>
    <p id="guideTxt">Point at the code on your table</p>
  </div>

  <canvas id="fx" aria-hidden="true"></canvas>

  <header class="bar">
    <div class="brand"><span class="sun" aria-hidden="true"></span><b>LUMA</b></div>
    <div class="bar-r">
      <button class="pill ic" id="perfBtn" aria-label="Performance stats"><svg viewBox="0 0 24 24"><path d="M13 2 4 14h7l-1 8 9-12h-7z"/></svg></button>
      <button class="pill" id="cartBtn" aria-label="Your order"><svg viewBox="0 0 24 24"><path d="M6 7h12l-1 13H7zM9 7a3 3 0 0 1 6 0"/></svg><span id="cartCount">0</span></button>
    </div>
  </header>

  <button class="explode" id="explode" aria-pressed="false" aria-label="Show ingredient layers">
    <svg viewBox="0 0 24 24"><path d="M4 17l8 4 8-4M4 12l8 4 8-4M12 3 4 7l8 4 8-4z"/></svg><span>Layers</span>
  </button>

  <section class="panel" aria-label="Menu">
    <div class="info">
      <div class="info-t">
        <p class="kicker" id="kicker"></p>
        <h2 id="dName">&nbsp;</h2>
        <p class="desc" id="dDesc"></p>
        <p class="facts"><span id="dKcal"></span><span id="dPrep"></span><span class="heat" id="dHeat"></span></p>
      </div>
      <button class="add" id="add"><span>Add</span><b id="dPrice"></b></button>
    </div>
    <div class="strip" id="strip" role="tablist" aria-label="Dishes"></div>
  </section>

  <section class="sheet" id="cartSheet" role="dialog" aria-labelledby="cTitle">
    <div class="grab"></div>
    <div class="s-top"><h2 id="cTitle">Your order</h2><button class="x" id="cartClose" aria-label="Close">×</button></div>
    <ul class="lines" id="lines"></ul>
    <div class="total"><span>Total</span><b id="total">₦0</b></div>
    <button class="add wide" id="send">Send to kitchen</button>
  </section>

  <section class="splash" id="splash">
    <div class="demo" aria-hidden="true">
      <div class="d-qr"><i></i><i></i><i></i><b></b></div>
      <div class="d-plate"><span></span></div>
      <div class="d-phone"></div>
    </div>
    <p class="eyebrow">Table menu · Lagos</p>
    <h1>LUMA</h1>
    <p class="lede">Keep the code on your table in view and every dish appears right on it.</p>
    <button class="start" id="start">Start camera</button>
    <button class="link" id="nocam">No camera? Try demo mode</button>
    <p class="ready" id="ready">&nbsp;</p>
  </section>

  <div class="toast" id="toast" role="status"></div>
  <aside class="hud" id="hud" aria-label="Performance stats"></aside>
</body>
</html>
